name: Publisher pull request checks

on:
  pull_request:
    paths:
      - "main.js"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "manifest.json"
      - "versions.json"
      - ".github/workflows/publisher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Verify release build parity
        run: npm run verify-build
      - name: Run candidate checks and regressions
        run: npm test
      - name: Ensure build reproducibility
        run: |
          npm run build
          git diff --exit-code -- main.js
