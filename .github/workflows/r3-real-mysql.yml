name: R3 Delivery Journal - real Laravel components and MySQL 8 (isolated)
on:
  push:
    branches:
      - work/r3-real-mysql-journal-integration-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-mysql-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: r3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      R3_DB_HOST: 127.0.0.1
      R3_DB_PORT: "3306"
      R3_DB_USER: root
      R3_DB_PASSWORD: testpass
      R3_DB_NAME: r3_test
      COMPOSER_NO_INTERACTION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP and required MySQL PDO driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install isolated Illuminate 12 database dependencies
        working-directory: staging/r3-real-mysql
        run: composer update --no-progress --prefer-dist --no-audit --no-scripts
      - name: Assert real MySQL PDO connection
        run: php -r 'if(!in_array("mysql",PDO::getAvailableDrivers(),true))exit(1); echo "MYSQL_PDO=AVAILABLE\n";'
      - name: Verify actual Laravel Schema migration and MySQL unique keys
        working-directory: staging/r3-real-mysql
        run: |
          set -o pipefail
          php journal_mysql_test.php | tee r3-mysql-result.txt
          grep -q 'RESULT=R3_REAL_MYSQL8_DELIVERY_JOURNAL_PASS' r3-mysql-result.txt
      - name: Upload real MySQL isolated test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-real-mysql-integration-test-result
          path: staging/r3-real-mysql/r3-mysql-result.txt
          if-no-files-found: warn
          retention-days: 7
